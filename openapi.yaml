    TradeCheckRequest:
      properties:
        plan_id:
          type: string
          title: Plan Id
        insider_role:
          $ref: '#/components/schemas/InsiderRole'
        adoption_date:
          type: string
          format: date
          title: Adoption Date
        next_earnings_disclosure_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Next Earnings Disclosure Date
        earliest_permitted_trade_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Earliest Permitted Trade Date
          description: Override; if omitted it is recomputed from role, adoption date and earnings date.
        plan_expiration_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Plan Expiration Date
        plan_terminated:
          type: boolean
          title: Plan Terminated
          default: false
        trade_date:
          type: string
          format: date
          title: Trade Date
        side:
          $ref: '#/components/schemas/TradeSide'
        shares:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Shares
        price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Price
        blackout_windows:
          items:
            $ref: '#/components/schemas/BlackoutWindow'
          type: array
          title: Blackout Windows
        scheduled_trades:
          items:
            $ref: '#/components/schemas/ScheduledTrade'
          type: array
          title: Scheduled Trades
          description: The plan's scheduled instructions; if provided, the trade must match one.
        share_tolerance:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Share Tolerance
          description: Allowed absolute difference between proposed and scheduled shares.
          default: '0'
      type: object
      required:
      - plan_id
      - insider_role
      - adoption_date
      - trade_date
      - side
      - shares
      title: TradeCheckRequest
      description: Pre-clearance for a proposed trade said to be made pursuant to an adopted plan.
    TradeCheckResponse:
      properties:
        plan_id:
          type: string
          title: Plan Id
        status:
          type: string
          enum:
          - PERMITTED
          - BLOCKED
          title: Status
        trade_date:
          type: string
          format: date
          title: Trade Date
        checks:
          additionalProperties:
            type: boolean
          type: object
          title: Checks
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        disclaimer:
          type: string
          title: Disclaimer
      type: object
      required:
      - plan_id
      - status
      - trade_date
      - checks
      - reasons
      - disclaimer
      title: TradeCheckResponse
    TradeSide:
      type: string
      enum:
      - SELL
      - BUY
      title: TradeSide
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VestTranche:
      properties:
        tranche:
          type: integer
          title: Tranche
        vest_date:
          type: string
          format: date
          title: Vest Date
        shares_vesting:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Shares Vesting
        cumulative_vested:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cumulative Vested
      type: object
      required:
      - tranche
      - vest_date
      - shares_vesting
      - cumulative_vested
      title: VestTranche
    VestingRequest:
      properties:
        grant_id:
          type: string
          title: Grant Id
        total_units:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Units
        vesting_start_date:
          type: string
          format: date
          title: Vesting Start Date
        vesting_months:
          type: integer
          exclusiveMinimum: 0.0
          title: Vesting Months
          default: 48
        cliff_months:
          type: integer
          minimum: 0.0
          title: Cliff Months
          default: 12
        frequency_months:
          type: integer
          exclusiveMinimum: 0.0
          title: Frequency Months
          default: 1
        whole_shares:
          type: boolean
          title: Whole Shares
          description: Round each tranche down to whole shares; remainder lands in the final tranche
          default: true
        as_of:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: As Of
        day_count:
          $ref: '#/components/schemas/DayCount'
          default: ACTUAL/365
      type: object
      required:
      - grant_id
      - total_units
      - vesting_start_date
      title: VestingRequest
    VestingResponse:
      properties:
        grant_id:
          type: string
          title: Grant Id
        schedule:
          items:
            $ref: '#/components/schemas/VestTranche'
          type: array
          title: Schedule
        total_units:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Units
        as_of:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: As Of
        vested_as_of:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Vested As Of
        unvested_as_of:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Unvested As Of
        elapsed_fraction:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Elapsed Fraction
        day_count:
          $ref: '#/components/schemas/DayCount'
      type: object
      required:
      - grant_id
      - schedule
      - total_units
      - day_count
      title: VestingResponse
